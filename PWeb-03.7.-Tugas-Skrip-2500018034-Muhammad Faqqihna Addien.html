<h2>Contoh Format Teks Pangkat Atas dan Pangkat Bawah</h2>

<p>
    Contoh pangkat atas:
    X<sup>2</sup> + Y<sup>2</sup> = Z<sup>2</sup>
</p>

<p>
    Contoh pangkat bawah:
    H<sub>2</sub>O dan CO<sub>2</sub>
</p>

<p>

    A<sub>1</sub><sup>2</sup>
</p>
